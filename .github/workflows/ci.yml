name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  no-built-assets:
    name: No built assets
    # Built assets are only committed by release-please in release pull requests. The branch name
    # alone could be picked by anyone, so the pull request must also be opened by GitHub Actions.
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Deletions count too: removing committed assets would break installs just like changing them.
      - name: Fail if built assets changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA"...HEAD -- public/vendor/larasell-admin)

          if [ -n "$files" ]; then
            echo "::error::Built assets are committed by release pull requests only. Remove these files from this pull request:"
            echo "$files"
            exit 1
          fi

  best-before:
    name: Best before
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fail on expired BEST-BEFORE markers
        run: npm run best-before

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Commitlint
        run: npx commitlint --from=${{ github.event.pull_request.base.sha || github.event.before }} --to=HEAD

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Icon matches the installed icon set
        run: |
          npm run generate:icons
          git diff --exit-code src/Enums/Icon.php

      - name: Build
        run: npm run build

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPStan
        run: composer phpstan

  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

  pest:
    name: Pest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Pest
        run: composer test

  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The pull request's own commit rather than the merge commit, so the installed package is
      # exactly the branch under review.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The prerequisites step of https://larasell.dev/docs/installation. It adds its bin directory
      # to the shell profile, which later steps don't read, so export it for them instead.
      - name: Install PHP, Composer and the Laravel CLI
        run: |
          /bin/bash -c "$(curl -fsSL https://larasell.dev/install/linux)"
          echo "$HOME/.config/larasell/bin" >> "$GITHUB_PATH"
          echo "PHP_INI_SCAN_DIR=$HOME/.config/larasell/bin" >> "$GITHUB_ENV"

      # Downloaded archives only; the Laravel application is created from scratch on every run.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: smoke-composer-${{ runner.os }}-${{ github.run_id }}
          restore-keys: smoke-composer-${{ runner.os }}-

      - name: Run smoke tests
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
          SMOKE_ARTIFACTS_DIR: ${{ runner.temp }}/smoke-tests
          SMOKE_PLAYWRIGHT_WITH_DEPS: "1"
        run: smoke-tests/run.sh

      - name: Upload screenshots, traces and logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-tests
          path: ${{ runner.temp }}/smoke-tests
          if-no-files-found: ignore

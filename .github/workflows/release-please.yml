name: release-please

# Built admin assets are only committed in release pull requests. Whenever
# release-please opens or updates its pull request, the assets job builds them
# and commits them to that pull request's branch, so the release commit and its
# tag ship the JavaScript, CSS, and fonts that Composer installs.
#
# release-please only rewrites its branch when the release notes change unless
# "always-update" is set, which keeps the built assets in sync with main.

on:
  push:
    branches:
      - main

concurrency:
  group: release-please

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  assets:
    name: Build assets for the release pull request
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin assets
        run: npm run build

      - name: Commit assets to the release branch
        env:
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          git add --all --force public/vendor/larasell-admin

          if git diff --cached --quiet; then
            echo 'Built assets are already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --message 'build: bundle admin assets for release'
          git push origin "HEAD:refs/heads/$BRANCH"

# Local playground for the admin panel: `vendor/bin/testbench serve`.
providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Laravel\Head\HeadServiceProvider
  - Larasell\Admin\AdminServiceProvider
  - Workbench\App\ProductNotes\ProductNotesServiceProvider
  - Workbench\App\Storefront\StorefrontServiceProvider
  - Inertia\ServiceProvider
  - Laravel\Reverb\ApplicationManagerServiceProvider
  - Laravel\Reverb\ReverbServiceProvider
  - Spatie\LaravelData\LaravelDataServiceProvider

env:
  # Development-only key for the local Testbench app.
  - APP_KEY=base64:mJ4Ue1jHG1x9tC0e3Dk0bS0xq5bS2kq8rXH3qXyq4yU=
  - APP_ENV=local
  - APP_DEBUG=true
  - DB_CONNECTION=sqlite
  - SESSION_DRIVER=file
  - CACHE_STORE=file
  # Jobs, e.g. audit log exports and the SEO URLs a new product gets, run on the `queue` service.
  - QUEUE_CONNECTION=database
  # Live props, e.g. the sidebar's sales channels, over the `reverb` service; development-only credentials.
  - BROADCAST_CONNECTION=reverb
  - REVERB_APP_ID=larasell-admin
  - REVERB_APP_KEY=larasell-admin-key
  - REVERB_APP_SECRET=larasell-admin-secret
  - REVERB_HOST=localhost
  - REVERB_PORT=8080
  - REVERB_SCHEME=http

workbench:
  install: false
